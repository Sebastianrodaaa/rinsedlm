[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rinsedlm"
version = "0.1.0"
description = "Trigger-agnostic payload-span masking during AR-to-MDLM conversion for backdoor cleansing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.51.0",
  "datasets>=2.19.0",
  "peft>=0.13.0",
  "accelerate>=0.33.0",
  "matplotlib>=3.8.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rinsedlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["EXE001"]
